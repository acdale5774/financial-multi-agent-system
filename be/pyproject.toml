[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-multi-agent-be"
version = "0.1.0"
description = "Backend for the Financial Multi-Agent Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Postgres + pgvector
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Structured-data handling (SimFin normalization)
    "pandas>=2.2",
    # SimFin bulk-dataset SDK (structured financial data ingestion)
    "simfin>=0.8",
    # Local static embeddings (numpy-only; torch/onnxruntime don't install on
    # this dev machine). Swap for voyageai/openai via ingestion/embeddings.py.
    "model2vec>=0.5",
    # HTTP client for external APIs (e.g. SEC)
    "httpx>=0.27",
    # LLM provider for the agent layer (native tool-calling loop, no
    # framework — see agents/README.md for the rationale).
    "openai>=1.100",
    # Multi-agent system (requirement 3): LangChain create_agent specialists.
    "langchain>=1.3",
    "langchain-openai>=1.3",
    # Deterministic chart rendering (Agg backend, no display server).
    "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Explicitly list the top-level packages so the build backend doesn't guess.
[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "core", "db", "evals", "ingestion", "retrieval", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A pragmatic default set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real end-to-end test against a live Postgres and OpenAI model; auto-skips unless both are available (see tests/test_e2e_smoke.py)",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
# Loosen to start; tighten (disallow_untyped_defs) as the codebase matures.
ignore_missing_imports = true
