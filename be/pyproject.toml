[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-multi-agent-be"
version = "0.1.0"
description = "Backend for the Financial Multi-Agent Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Postgres + pgvector
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Structured-data handling (SimFin normalization)
    "pandas>=2.2",
    # SimFin bulk-dataset SDK (structured financial data ingestion)
    "simfin>=0.8",
    # HTTP client for external APIs (e.g. SEC)
    "httpx>=0.27",
    # TODO: Add an embedding/LLM provider dependency once chosen, e.g.
    #       "anthropic", "openai", or "sentence-transformers".
    # TODO: Add the agent framework dependency (or keep a native tool-calling loop).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Explicitly list the top-level packages so the build backend doesn't guess.
[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "core", "db", "ingestion", "retrieval", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A pragmatic default set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
# Loosen to start; tighten (disallow_untyped_defs) as the codebase matures.
ignore_missing_imports = true
